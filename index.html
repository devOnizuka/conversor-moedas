<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Moedas</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

</head>
<body>
    <div class="moldura">



    <div class="titulo">
    <h1>Conversor de Moedas</h1>
    </div>



<div class="insercaoValores">
   <form>
        <label for="valor">Valor:</label>
        <input type="number" step="0.01" id="valor" placeholder="0,00">
    </form>
</div>
    

    
<div class="moedas">
        <label for="moedaOrigem">De:</label>
        <select id="moedaOrigem"></select>
        <label for="moedaDestino">Para:</label>
        <select id="moedaDestino"></select>  
</div>



<div class="botao">
        <button id="converter">Converter</button>
</div>



<div class="resultadoConversao">
        <h2>Resultado:</h2>
        <p id="resultadoConversao"></p>
</div> 



<div class="cotacao">
        <p>Cotação Atual</p>
</div>
    



</div>
</body>
</html>
